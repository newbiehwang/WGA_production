AWSTemplateFormatVersion: '2010-09-09'
Description: 'WGA LLM Service CloudFormation Template'

Parameters:
  Environment:
    Type: String
    Description: The deployment environment

  McpImageUri:
    Type: String
    Description: ECR URI for MCP Lambda Docker image

  ApiGatewayId:
    Type: String
    Description: API Gateway ID

  ApiGatewayRootResourceId:
    Type: String
    Description: API Gateway Root Resource ID

  FrontendRedirectDomain:
    Type: String
    Description: The domain for frontend redirection

  KnowledgeBaseIdParameter:
    Type: String
    Description: Bedrock Knowledge Base ID

  CognitoAuthorizerId:
    Type: String
    Description: API Gateway Cognito User Pool Authorizer ID

  CodeVersion:
    Type: String
    Description: 배포 코드 버전 (Lambda zip S3 키에 포함되어 배포마다 새 코드가 반영되게 함)

Resources:
  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'wga-mcp-${Environment}'
      PackageType: Image
      Code:
        ImageUri: !Ref McpImageUri
      Role: !GetAtt McpLambdaExecutionRole.Arn
      # X-Ray 추적과 JSON 구조화 로그 (REPORT 레코드의 initDurationMs로 콜드 스타트 측정 가능)
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Timeout: 180
      MemorySize: 2048
      Environment:
        Variables:
          ENV: !Ref Environment
          MCP_SESSION_TABLE: !Sub 'wga-mcp-sessions-${Environment}'
          DIAGRAM_BUCKET: !Sub 'wga-diagrambucket-${AWS::AccountId}-${Environment}'
          # 변경 도구 실행 직전의 승인 재확인 (lambda_mcp/approval.py)
          PENDING_ACTIONS_TABLE: !Ref PendingActionsTable
          # AWS 공식 MCP 서버(awslabs)의 로그(loguru)는 오류만 남긴다
          FASTMCP_LOG_LEVEL: ERROR
          # Lambda에서 쓸 수 있는 곳은 /tmp뿐이다. 라이브러리(fastmcp 등)가 홈 폴더에 설정·캐시를 만들 때 쓰인다
          HOME: /tmp

  # IAM 인증 Function URL: SigV4로 서명된 요청만 허용한다.
  # 같은 계정의 LLM Lambda Role이 identity 정책으로 호출 권한을 가지므로 resource 정책(AWS::Lambda::Permission)은 두지 않는다.
  McpLambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt McpLambdaFunction.Arn
      AuthType: AWS_IAM

  # MCP 서버 전용 Role: mcp/app.py, mcp/lambda_mcp/*의 읽기 전용 조회 도구에 필요한 액션만 허용
  McpLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'wga-mcp-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: McpReadOnlyTools
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # AWS 공식 CloudWatch MCP 서버 (awslabs.cloudwatch-mcp-server의 README "Required IAM Permissions")
              # 로그 그룹 조회, Logs Insights 쿼리(시작·결과·중지·목록), 저장된 쿼리, 로그 이상 탐지
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeQueryDefinitions
                  - logs:DescribeQueries
                  - logs:ListLogAnomalyDetectors
                  - logs:ListAnomalies
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:StopQuery
                Resource: '*'
              # 공식 CloudWatch MCP 서버의 메트릭·알람 도구 + 직접 둔 대시보드 도구 (app.py)
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:ListDashboards
                  - cloudwatch:GetDashboard
                Resource: '*'
              # AWS 공식 Billing and Cost Management MCP 서버의 Cost Explorer 도구 (조회만, 리소스 수준 권한 미지원)
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostAndUsageWithResources
                  - ce:GetDimensionValues
                  - ce:GetCostForecast
                  - ce:GetUsageForecast
                  - ce:GetTags
                  - ce:GetCostCategories
                  - ce:GetSavingsPlansUtilization
                Resource: '*'
              # AWS 공식 CloudTrail MCP 서버의 이벤트 조회 (최근 90일 관리 이벤트, 무료).
              # 유료인 CloudTrail Lake 도구는 빼서(official.py) cloudtrail:StartQuery 등은 주지 않는다. LookupEvents는 리소스 수준 권한 미지원
              - Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: '*'
              # AWS 공식 Pricing MCP 서버의 가격표 조회 (공개 가격, 무료). 가격 파일 주소 도구는 빼서
              # pricing:ListPriceLists·GetPriceListFileUrl은 주지 않는다. Pricing API는 리소스 수준 권한 미지원
              - Effect: Allow
                Action:
                  - pricing:DescribeServices
                  - pricing:GetAttributeValues
                  - pricing:GetProducts
                Resource: '*'
              # AWS 공식 IAM MCP 서버의 조회 도구 12개가 부르는 API만 (읽기 전용).
              # 변경 도구는 빼서(official.py) Create*·Delete*·Attach*·Put*·CreateAccessKey 등 쓰기 권한은 주지 않는다
              - Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:GetUser
                  - iam:ListAccessKeys
                  - iam:ListAttachedUserPolicies
                  - iam:ListGroupsForUser
                  - iam:ListUserPolicies
                  - iam:GetUserPolicy
                  - iam:ListRoles
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListPolicies
                  - iam:GetPolicyVersion
                  - iam:ListGroups
                  - iam:GetGroup
                  - iam:ListAttachedGroupPolicies
                  - iam:ListGroupPolicies
                  - iam:SimulatePrincipalPolicy
                Resource: '*'
              # AWS 공식 네트워크 MCP 서버의 VPC·ENI·경로 추적 도구 6개가 부르는 조회 API만.
              # VPC 흐름 로그는 위의 Logs Insights 권한(StartQuery·GetQueryResults)으로 읽는다. EC2 Describe*는 리소스 수준 권한 미지원
              - Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeFlowLogs
                Resource: '*'
              # MCP 세션 테이블 (lambda_mcp/session.py)
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wga-mcp-sessions-${Environment}'
              # 변경 도구 (app.py의 set_log_retention · set_alarm_actions). 승인된 작업만 실행되고,
              # 이 환경의 WGA 리소스로만 한정한다 (도구 안의 이름 확인과 같은 범위)
              - Effect: Allow
                Action:
                  - logs:PutRetentionPolicy
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/wga-*-${Environment}'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/wga-*-${Environment}:*'
              - Effect: Allow
                Action:
                  - cloudwatch:EnableAlarmActions
                  - cloudwatch:DisableAlarmActions
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:wga-${Environment}-*'
              # 거버넌스 알람(인젝션 의심, 승인 거절 반복)은 AI가 요청한 변경으로 끌 수 없다 (명시적 Deny가 Allow보다 우선)
              - Effect: Deny
                Action:
                  - cloudwatch:EnableAlarmActions
                  - cloudwatch:DisableAlarmActions
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:wga-${Environment}-governance-*'
              # 승인 재확인: 승인 상태 확인 + 실행 표시(조건부 쓰기)와 결과 기록 (lambda_mcp/approval.py)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PendingActionsTable.Arn
              # 다이어그램 이미지 업로드 및 presigned URL 발급 (lambda_mcp/diagram_utils.py)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::wga-diagrambucket-${AWS::AccountId}-${Environment}/*'

  # LLM 서비스 Role: Bedrock 호출, 설정(SSM) 조회, 대화 기록 조회, MCP Function URL 호출만 허용
  LlmLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'wga-llm-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LlmServiceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock Converse (mcp_bedrock_client.py), Knowledge Base RetrieveAndGenerate (common/utils.py)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
              # MCP 서버 Function URL 호출 (SigV4)
              - Effect: Allow
                Action:
                  - lambda:InvokeFunctionUrl
                  - lambda:InvokeFunction
                Resource: !GetAtt McpLambdaFunction.Arn
              # 설정 로드 (common/config.py: GetParameter, GetParametersByPath)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wga/${Environment}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wga/${Environment}/*'
              # SecureString 복호화는 SSM을 통한 요청으로만 한정
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              # 대화 기록 캐시 조회, Athena 테이블 레지스트리 조회 (llm_service.py)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wga-chat-history-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AthenaTableRegistry-${Environment}'
              # 답변을 만드는 동안의 진행 상황 기록·조회 (llm_progress.py)
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt LlmProgressTable.Arn
              # 감사 로그 (audit.py): 추가와 조회만. 수정·삭제(UpdateItem·DeleteItem)는 주지 않는다
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt AuditTable.Arn
                  - !Sub '${AuditTable.Arn}/index/by-day'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogGroup.Arn
              # 변경 작업 승인 요청 저장·조회·결정 (approvals.py). AWS를 바꾸는 권한은 이 역할에 없다 (MCP 역할에만)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PendingActionsTable.Arn

  # 답변을 만드는 동안의 진행 상황 (생각 중·도구 실행 중·사고 요약). 화면이 답을 기다리며 1초마다 읽는다.
  # 답을 기다리는 동안만 쓰는 임시 기록이라 한 시간 뒤 TTL로 지워지고, 백업(PITR)·고객 관리 KMS 키를 두지 않는다
  LlmProgressTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: 한 시간 뒤 TTL로 지워지는 임시 진행 상황이라 시점 복구가 필요 없다
          - id: CKV_AWS_119
            comment: 임시 진행 상황이라 AWS 소유 키 암호화(기본값)로 충분하다
    Properties:
      TableName: !Sub 'wga-llm-progress-${Environment}'
      AttributeDefinitions:
        - AttributeName: 'requestId'
          AttributeType: S
      KeySchema:
        - AttributeName: 'requestId'
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: 'expiresAt'
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # 감사 로그: 누가 언제 어떤 도구를 어떤 입력으로 불렀나 (audit.py). 화면(GET /audit)에서 조회한다.
  # 기본 키 userId + at(시각#도구 호출 ID)으로 한 사람의 기간을, 날짜 인덱스(by-day)로 모든 사람의 기간을 읽는다.
  # 90일 뒤 TTL로 지워지고, 더 오래 볼 기록은 CloudWatch Logs(AuditLogGroup, 1년)에 있다
  AuditTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: AWS 소유 키 암호화(기본값)를 쓴다. 고객 관리 KMS 키는 월 비용이 들어 토이 프로젝트에서는 두지 않는다
    Properties:
      TableName: !Sub 'wga-audit-${Environment}'
      AttributeDefinitions:
        - AttributeName: 'userId'
          AttributeType: S
        - AttributeName: 'at'
          AttributeType: S
        - AttributeName: 'day'
          AttributeType: S
      KeySchema:
        - AttributeName: 'userId'
          KeyType: HASH
        - AttributeName: 'at'
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: 'by-day'
          KeySchema:
            - AttributeName: 'day'
              KeyType: HASH
            - AttributeName: 'at'
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      # 감사 기록은 실수로 지우거나 덮어써도 되돌릴 수 있어야 한다 (35일 이내 시점 복구)
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: 'expiresAt'
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # 감사 로그의 장기 보관본 (JSON 한 줄씩, Logs Insights로 분석). Lambda 로그 그룹과 따로 두어 보관 기간을 다르게 한다
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs 기본 암호화를 쓴다. 고객 관리 KMS 키는 월 비용이 들어 두지 않는다
    Properties:
      LogGroupName: !Sub '/wga/${Environment}/audit'
      RetentionInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # 변경 작업 승인 요청 (approvals.py). 10분 안에 승인하지 않으면 만료되고, 30일 뒤 TTL로 지워진다.
  # 오래 볼 기록(누가 요청·승인했고 무엇이 실행됐나)은 감사 로그에 있다
  PendingActionsTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: 짧게 쓰는 승인 대기 기록이다. 모든 사건은 감사 로그(시점 복구 켬)에 남는다
          - id: CKV_AWS_119
            comment: AWS 소유 키 암호화(기본값)를 쓴다. 고객 관리 KMS 키는 월 비용이 들어 두지 않는다
    Properties:
      TableName: !Sub 'wga-pending-actions-${Environment}'
      AttributeDefinitions:
        - AttributeName: 'actionId'
          AttributeType: S
      KeySchema:
        - AttributeName: 'actionId'
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: 'ttl'
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LlmLambdaLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub 'llm-layer-${Environment}'
      Description: Common Python dependencies
      Content:
        S3Bucket: !Sub 'wga-deployment-${AWS::AccountId}-${Environment}'
        S3Key: !Sub 'layers/common-layer-${Environment}-${CodeVersion}.zip'
      CompatibleRuntimes:
        - python3.12

  LlmLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'wga-llm-${Environment}'
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Sub 'wga-deployment-${AWS::AccountId}-${Environment}'
        S3Key: !Sub 'llm/llm-lambda-${Environment}-${CodeVersion}.zip'
      Timeout: 180
      MemorySize: 256
      Role: !GetAtt LlmLambdaExecutionRole.Arn
      # X-Ray 추적과 JSON 구조화 로그 (REPORT 레코드의 initDurationMs로 콜드 스타트 측정 가능)
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Environment:
        Variables:
          ENV: !Ref Environment
          ATHENA_TABLE_REGISTRY_TABLE: !Sub 'AthenaTableRegistry-${Environment}'
          LLM_PROGRESS_TABLE: !Ref LlmProgressTable
          # 민감정보 가리기: 이 계정의 ID는 도구 결과 어디에 있든 Claude로 보내기 전에 가린다 (redaction.py)
          ACCOUNT_ID: !Ref AWS::AccountId
          # 감사 로그 (audit.py)
          AUDIT_TABLE: !Ref AuditTable
          AUDIT_LOG_GROUP: !Ref AuditLogGroup
          # 변경 작업 승인 (approvals.py)
          PENDING_ACTIONS_TABLE: !Ref PendingActionsTable
      Layers:
        - !Ref LlmLambdaLayer
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LlmApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref ApiGatewayRootResourceId
      PathPart: 'llm1'

  LlmMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmApiResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 120000

  LlmOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 120000

  LlmLambdaPermissionForOptions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/OPTIONS/llm1'

  LlmLambdaPermissionForLlm1:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/llm1'

