AWSTemplateFormatVersion: '2010-09-09'
Description: 'WGA LLM Service CloudFormation Template'

Parameters:
  Environment:
    Type: String
    Description: The deployment environment

  McpImageUri:
    Type: String
    Description: ECR URI for MCP Lambda Docker image

  ApiGatewayId:
    Type: String
    Description: API Gateway ID

  ApiGatewayRootResourceId:
    Type: String
    Description: API Gateway Root Resource ID

  FrontendRedirectDomain:
    Type: String
    Description: The domain for frontend redirection

  KnowledgeBaseIdParameter:
    Type: String
    Description: Bedrock Knowledge Base ID

  CognitoAuthorizerId:
    Type: String
    Description: API Gateway Cognito User Pool Authorizer ID

  CodeVersion:
    Type: String
    Description: 배포 코드 버전 (Lambda zip S3 키에 포함되어 배포마다 새 코드가 반영되게 함)

Resources:
  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'wga-mcp-${Environment}'
      PackageType: Image
      Code:
        ImageUri: !Ref McpImageUri
      Role: !GetAtt McpLambdaExecutionRole.Arn
      # X-Ray 추적과 JSON 구조화 로그 (REPORT 레코드의 initDurationMs로 콜드 스타트 측정 가능)
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Timeout: 180
      MemorySize: 2048
      Environment:
        Variables:
          ENV: !Ref Environment
          MCP_SESSION_TABLE: !Sub 'wga-mcp-sessions-${Environment}'
          DIAGRAM_BUCKET: !Sub 'wga-diagrambucket-${AWS::AccountId}-${Environment}'
          # AWS 공식 MCP 서버(awslabs)의 로그(loguru)는 오류만 남긴다
          FASTMCP_LOG_LEVEL: ERROR
          # Lambda에서 쓸 수 있는 곳은 /tmp뿐이다. 라이브러리(fastmcp 등)가 홈 폴더에 설정·캐시를 만들 때 쓰인다
          HOME: /tmp

  # IAM 인증 Function URL: SigV4로 서명된 요청만 허용한다.
  # 같은 계정의 LLM Lambda Role이 identity 정책으로 호출 권한을 가지므로 resource 정책(AWS::Lambda::Permission)은 두지 않는다.
  McpLambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt McpLambdaFunction.Arn
      AuthType: AWS_IAM

  # MCP 서버 전용 Role: mcp/app.py, mcp/lambda_mcp/*의 읽기 전용 조회 도구에 필요한 액션만 허용
  McpLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'wga-mcp-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: McpReadOnlyTools
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # AWS 공식 CloudWatch MCP 서버 (awslabs.cloudwatch-mcp-server의 README "Required IAM Permissions")
              # 로그 그룹 조회, Logs Insights 쿼리(시작·결과·중지·목록), 저장된 쿼리, 로그 이상 탐지
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeQueryDefinitions
                  - logs:DescribeQueries
                  - logs:ListLogAnomalyDetectors
                  - logs:ListAnomalies
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:StopQuery
                Resource: '*'
              # 공식 CloudWatch MCP 서버의 메트릭·알람 도구 + 직접 둔 대시보드 도구 (app.py)
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:ListDashboards
                  - cloudwatch:GetDashboard
                Resource: '*'
              # AWS 공식 Billing and Cost Management MCP 서버의 Cost Explorer 도구 (조회만, 리소스 수준 권한 미지원)
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostAndUsageWithResources
                  - ce:GetDimensionValues
                  - ce:GetCostForecast
                  - ce:GetUsageForecast
                  - ce:GetTags
                  - ce:GetCostCategories
                  - ce:GetSavingsPlansUtilization
                Resource: '*'
              # MCP 세션 테이블 (lambda_mcp/session.py)
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wga-mcp-sessions-${Environment}'
              # 다이어그램 이미지 업로드 및 presigned URL 발급 (lambda_mcp/diagram_utils.py)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::wga-diagrambucket-${AWS::AccountId}-${Environment}/*'

  # LLM 서비스 Role: Bedrock 호출, 설정(SSM) 조회, 대화 기록 조회, MCP Function URL 호출만 허용
  LlmLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'wga-llm-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LlmServiceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock Converse (mcp_bedrock_client.py), Knowledge Base RetrieveAndGenerate (common/utils.py)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action:
                  - bedrock:RetrieveAndGenerate
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
              # MCP 서버 Function URL 호출 (SigV4)
              - Effect: Allow
                Action:
                  - lambda:InvokeFunctionUrl
                  - lambda:InvokeFunction
                Resource: !GetAtt McpLambdaFunction.Arn
              # 설정 로드 (common/config.py: GetParameter, GetParametersByPath)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wga/${Environment}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wga/${Environment}/*'
              # SecureString 복호화는 SSM을 통한 요청으로만 한정
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              # 대화 기록 캐시 조회, Athena 테이블 레지스트리 조회 (llm_service.py)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wga-chat-history-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AthenaTableRegistry-${Environment}'
              # 답변을 만드는 동안의 진행 상황 기록·조회 (llm_progress.py)
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt LlmProgressTable.Arn

  # 답변을 만드는 동안의 진행 상황 (생각 중·도구 실행 중·사고 요약). 화면이 답을 기다리며 1초마다 읽는다.
  # 답을 기다리는 동안만 쓰는 임시 기록이라 한 시간 뒤 TTL로 지워지고, 백업(PITR)·고객 관리 KMS 키를 두지 않는다
  LlmProgressTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: 한 시간 뒤 TTL로 지워지는 임시 진행 상황이라 시점 복구가 필요 없다
          - id: CKV_AWS_119
            comment: 임시 진행 상황이라 AWS 소유 키 암호화(기본값)로 충분하다
    Properties:
      TableName: !Sub 'wga-llm-progress-${Environment}'
      AttributeDefinitions:
        - AttributeName: 'requestId'
          AttributeType: S
      KeySchema:
        - AttributeName: 'requestId'
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: 'expiresAt'
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LlmLambdaLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub 'llm-layer-${Environment}'
      Description: Common Python dependencies
      Content:
        S3Bucket: !Sub 'wga-deployment-${AWS::AccountId}-${Environment}'
        S3Key: !Sub 'layers/common-layer-${Environment}-${CodeVersion}.zip'
      CompatibleRuntimes:
        - python3.12

  LlmLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'wga-llm-${Environment}'
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Sub 'wga-deployment-${AWS::AccountId}-${Environment}'
        S3Key: !Sub 'llm/llm-lambda-${Environment}-${CodeVersion}.zip'
      Timeout: 180
      MemorySize: 256
      Role: !GetAtt LlmLambdaExecutionRole.Arn
      # X-Ray 추적과 JSON 구조화 로그 (REPORT 레코드의 initDurationMs로 콜드 스타트 측정 가능)
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Environment:
        Variables:
          ENV: !Ref Environment
          ATHENA_TABLE_REGISTRY_TABLE: !Sub 'AthenaTableRegistry-${Environment}'
          LLM_PROGRESS_TABLE: !Ref LlmProgressTable
      Layers:
        - !Ref LlmLambdaLayer
      Tags:
        - Key: Environment
          Value: !Ref Environment

  LlmApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref ApiGatewayRootResourceId
      PathPart: 'llm1'

  LlmMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmApiResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 120000

  LlmOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'
        TimeoutInMillis: 120000

  LlmLambdaPermissionForOptions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/OPTIONS/llm1'

  LlmLambdaPermissionForLlm1:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/llm1'

  # GET /llm1/progress/{requestId}: 답변을 만드는 동안의 진행 상황 (llm_service.handle_progress)
  LlmProgressResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref LlmApiResource
      PathPart: 'progress'

  LlmProgressRequestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref LlmProgressResource
      PathPart: '{requestId}'

  LlmProgressMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmProgressRequestResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'

  # 브라우저는 Authorization 헤더를 붙인 GET 전에 OPTIONS(CORS preflight)를 보낸다
  LlmProgressOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref LlmProgressRequestResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'

  LlmLambdaPermissionForProgress:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/*/llm1/progress/*'

  Llm2ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref ApiGatewayRootResourceId
      PathPart: 'llm2'

  Llm2Method:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref Llm2ApiResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizerId
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'

  LlmLambdaPermissionForLlm2:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/POST/llm2'

  HealthApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayId
      ParentId: !Ref ApiGatewayRootResourceId
      PathPart: 'health'

  HealthMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayId
      ResourceId: !Ref HealthApiResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LlmLambdaFunction.Arn}/invocations'

  LlmLambdaPermissionForHealth:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref LlmLambdaFunction
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayId}/*/GET/health'