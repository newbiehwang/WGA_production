name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 테스트 · 정적 분석
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Lambda 런타임과 동일
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: ruff (문법 오류, 정의되지 않은 이름 등)
        run: ruff check --output-format=github .
      - name: pytest (moto로 AWS 모킹)
        run: pytest

  iac:
    name: IaC 검증 · 보안 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: pip install cfn-lint==1.34.2 checkov==3.3.19
      - name: cfn-lint (오류만 실패 처리)
        run: cfn-lint --non-zero-exit-code error --format parseable cloudformation/*.yaml
      - name: checkov - CloudFormation (기준선 이후 새로 생긴 문제만 실패)
        run: >
          checkov -d cloudformation --framework cloudformation
          --baseline cloudformation/.checkov.baseline --compact --quiet
      - name: checkov - GitHub Actions 워크플로
        run: checkov -d .github/workflows --framework github_actions --compact --quiet
      - name: deploy.sh 문법 검사
        run: bash -n deploy.sh

  frontend:
    name: 프론트엔드 타입 검사 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc 타입 검사 + vite 빌드
        run: npm run build

