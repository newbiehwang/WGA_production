name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 테스트 · 정적 분석
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Lambda 런타임과 동일
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: ruff (문법 오류, 정의되지 않은 이름 등)
        run: ruff check --output-format=github .
      - name: pytest (moto로 AWS 모킹)
        run: pytest

  iac:
    name: IaC 검증 · 보안 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 도구 설치
        run: pip install cfn-lint==1.34.2 checkov==3.3.19
      - name: cfn-lint (오류만 실패 처리)
        run: cfn-lint --non-zero-exit-code error --format parseable cloudformation/*.yaml
      - name: checkov - CloudFormation (기준선 이후 새로 생긴 문제만 실패)
        run: >
          checkov -d cloudformation --framework cloudformation
          --baseline cloudformation/.checkov.baseline --compact --quiet
      - name: checkov - GitHub Actions 워크플로
        run: checkov -d .github/workflows --framework github_actions --compact --quiet
      - name: deploy.sh 문법 검사
        run: bash -n deploy.sh

  frontend:
    name: 프론트엔드 타입 검사 · 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: vue-tsc 타입 검사 + vite 빌드
        run: npm run build

  macos:
    name: 설치 마법사 macOS 앱 빌드 · 테스트
    # 공개 저장소라 macOS 러너도 무료다. Xcode는 러너 이미지의 기본 버전을 쓴다.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen 설치
        # .xcodeproj는 커밋하지 않고 project.yml에서 만든다 (installer/macos/project.yml 주석 참고)
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
      - name: Xcode 프로젝트 생성
        run: xcodegen generate --quiet
        working-directory: installer/macos
      - name: xcodebuild test (앱 번들 구성 + 로직 패키지)
        # 키체인·실제 AWS를 쓰는 테스트는 환경 변수로 막혀 있어 여기서는 실행되지 않는다
        # (WGA_KEYCHAIN_TESTS, WGA_CORE_E2E — installer/macos/README.md 참고)
        run: |
          set -o pipefail
          xcodebuild test \
            -project WGAInstaller.xcodeproj -scheme WGAInstaller \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGN_IDENTITY=- | tail -60
        working-directory: installer/macos
      - name: 배포용 .dmg 만들기 (Release 빌드·서명 검증까지 확인)
        run: installer/macos/make-dmg.sh "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: WGA-Installer-dmg
          path: |
            ${{ runner.temp }}/dmg/*.dmg
            ${{ runner.temp }}/dmg/*.dmg.sha256
          retention-days: 7
