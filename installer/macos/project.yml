# XcodeGen 설정: `cd installer/macos && xcodegen generate` 로 WGAInstaller.xcodeproj를 만든다.
# .xcodeproj는 생성물이라 커밋하지 않는다 (.gitignore). 손으로 만든 프로젝트 파일은 충돌이 잦고 리뷰가 어렵기 때문.
#
# 만들어지는 앱 번들
#   WGA Installer.app/Contents/MacOS/WGA Installer           앱
#   WGA Installer.app/Contents/MacOS/wga-credential-helper   credential_process 헬퍼 (copyFiles: executables)
#   WGA Installer.app/Contents/Resources/core/               installer/core 복사본 (빌드 스크립트)
name: WGAInstaller

options:
  bundleIdPrefix: com.wga
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  WGAInstallerKit:
    path: WGAInstallerKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Program 가입 전이라 ad-hoc 서명("-")으로 로컬에서만 실행한다.
    # 공증(notarization)에 대비해 Hardened Runtime은 켜 둔다.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  WGAInstaller:
    type: application
    platform: macOS
    sources:
      - path: WGAInstaller
    dependencies:
      - package: WGAInstallerKit
        product: WGAInstallerKit
      # 헬퍼를 먼저 빌드하고 앱 번들의 Contents/MacOS에 넣는다 (XcodeGen은 embed: true일 때만 copy를 적용한다)
      - target: wga-credential-helper
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: WGAInstaller/Resources/Info.plist
      properties:
        CFBundleDisplayName: WGA Installer
        CFBundleName: WGA Installer
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: WGAInstaller/Resources/WGAInstaller.entitlements
      properties:
        # App Store 밖에서 배포한다. aws·gh·deploy.sh 같은 외부 명령을 실행해야 해서 샌드박스를 쓸 수 없다
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: WGA Installer
        PRODUCT_BUNDLE_IDENTIFIER: com.wga.installer
        # 아래 빌드 스크립트가 저장소의 installer/core를 읽어야 해서 스크립트 샌드박스를 끈다
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: installer/core 복사
        # 앱 번들에 CLI(Python 단계 엔진)를 넣는다. __pycache__ 같은 생성물은 빼고, 지운 파일은 번들에서도 지운다
        script: |
          set -euo pipefail
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/core"
          mkdir -p "$DEST"
          rsync -a --delete --exclude '__pycache__' --exclude '*.pyc' "${PROJECT_DIR}/../core/" "$DEST/"
          chmod +x "$DEST/wga-installer"
        inputFiles:
          - $(PROJECT_DIR)/../core/wga-installer
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/core/wga-installer
        basedOnDependencyAnalysis: false   # 파이썬 파일이 바뀔 때마다 다시 복사한다

  # AWS CLI credential_process로 등록되는 명령줄 도구. 패키지의 실행 타깃과 같은 main.swift를 빌드한다
  wga-credential-helper:
    type: tool
    platform: macOS
    sources:
      - path: WGAInstallerKit/Sources/wga-credential-helper
    dependencies:
      - package: WGAInstallerKit
        product: CredentialStore
    settings:
      base:
        PRODUCT_NAME: wga-credential-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.wga.installer.credential-helper
        SKIP_INSTALL: YES
        # 실행 파일 안에 Info.plist를 넣어 서명 ID를 번들 ID로 고정한다. 없으면 빌드마다 바뀌는 ID가 붙는다.
        # 나중에 Developer ID로 서명하면 키체인이 "같은 프로그램"을 이 ID와 팀 ID로 알아보므로 고정되어 있어야 한다
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  WGAInstallerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WGAInstallerTests
    dependencies:
      - target: WGAInstaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wga.installer.tests
        GENERATE_INFOPLIST_FILE: YES
        # 테스트를 앱 안에서 실행한다 (앱 번들 구성을 확인하기 위해)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WGA Installer.app/Contents/MacOS/WGA Installer
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  WGAInstaller:
    build:
      targets:
        WGAInstaller: all
    test:
      targets:
        - WGAInstallerTests
        # 로직 테스트는 패키지에 있다 (swift test로도 실행 가능)
        - package: WGAInstallerKit/WGAInstallerKitTests
        - package: WGAInstallerKit/CredentialStoreTests
